      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#0038E0" />
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)" />
  
  <!-- Wave to Document Graphic -->
