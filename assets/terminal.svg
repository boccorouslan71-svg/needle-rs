<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img"
     aria-label="A needle-rs terminal session: two tool calls answered locally by Needle v2, then the same query on Needle v1">
  <defs>
    <linearGradient id="titlebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262D"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="470" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="470" fill="#0D1117"/>
    <rect width="1200" height="40" fill="url(#titlebar)"/>
    <circle cx="24" cy="20" r="6" fill="#FF5F57"/>
    <circle cx="46" cy="20" r="6" fill="#FEBC2E"/>
    <circle cx="68" cy="20" r="6" fill="#28C840"/>
    <text x="600" y="25" text-anchor="middle"
          font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
          font-size="12" fill="#7D8590">needle-rs — local tool calling, no server</text>
  </g>
  <rect width="1200" height="470" rx="12" fill="none" stroke="#21262D" stroke-width="1"/>

  <g font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <!-- Needle v2: one file -->
    <text x="28" y="76" fill="#6E7681">
      <tspan fill="#7EE787">$</tspan> hf download Cactus-Compute/needle2 needle2.cact <tspan fill="#6E7681">--local-dir weights/</tspan>
    </text>
    <text x="28" y="100" fill="#7D8590">needle2.cact  13.7 MB   <tspan fill="#6E7681">weights + geometry + tokenizer, one file</tspan></text>

    <text x="28" y="140" fill="#C9D1D9">
      <tspan fill="#7EE787">$</tspan> needle-rs <tspan fill="#E8633F">--json --constrain</tspan> weights/needle2.cact \
    </text>
    <text x="52" y="162" fill="#C9D1D9">"What's the weather in Paris?" "$TOOLS"</text>
    <text x="28" y="186" fill="#7EE787">[{"name":"get_weather","arguments":{"city":"Paris"}}]</text>

    <text x="28" y="226" fill="#C9D1D9">
      <tspan fill="#7EE787">$</tspan> needle-rs <tspan fill="#E8633F">--json</tspan> weights/needle2.cact \
    </text>
    <text x="52" y="248" fill="#C9D1D9">"Email alice@example.com saying the build is green" "$TOOLS"</text>
    <text x="28" y="272" fill="#7EE787">[{"name":"send_email","arguments":{"to":"alice@example.com",</text>
    <text x="28" y="292" fill="#7EE787">  "subject":"Build","body":"the build is green"}}]</text>

    <!-- Needle v1: same binary -->
    <text x="28" y="336" fill="#6E7681">
      <tspan fill="#6E7681">#</tspan> Needle v1 works too — same binary, the file extension picks the version
    </text>
    <text x="28" y="360" fill="#C9D1D9">
      <tspan fill="#7EE787">$</tspan> needle-rs weights/needle.safetensors weights/vocab.txt "$Q" "$TOOLS"
    </text>
    <text x="28" y="384" fill="#7EE787">[{"name":"get_weather","arguments":{"city":"Paris"}}]</text>
  </g>

  <!-- Footer facts -->
  <line x1="28" y1="408" x2="1172" y2="408" stroke="#21262D" stroke-width="1"/>
  <!-- One flowing text element rather than hand-placed items: renderers
       substitute monospace fonts of very different widths, and fixed x
       positions overflow the viewBox on the wide ones. -->
  <text x="28" y="432" font-family="ui-monospace, monospace" font-size="12" fill="#6E7681">9 ms load &#183; 8.2 ms/token decode &#183; ~23 MB session &#183; 0 runtime dependencies</text>
  <text x="28" y="454" font-family="ui-monospace, monospace" font-size="11" fill="#484F58">
    Apple M5 Max, steady state. Output is a real session; see BENCHMARKS.md for method.
  </text>
</svg>
